<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3f8f5f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>إنجاز — مفكرة المهام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--card:#fff;--tx:#25302a;--mu:#7b867f;--ln:#e9e6dd;--g:#3f8f5f;--gl:#e4f2e9;--gold:#d9a93c;--track:#e8e8e3;--sh:0 1px 6px rgba(40,50,40,.07);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171c19;--card:#202723;--tx:#e8efe9;--mu:#92a097;--ln:#2e3731;--g:#5bb87f;--gl:#233a2c;--track:#2d3530;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171c19;--card:#202723;--tx:#e8efe9;--mu:#92a097;--ln:#2e3731;--g:#5bb87f;--gl:#233a2c;--track:#2d3530;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tajawal,system-ui,sans-serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:12px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between}
.top h1{margin:0;font-size:24px;font-weight:800;color:var(--g)}
.top small{color:var(--mu);display:block;margin-top:-6px}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:var(--card);box-shadow:var(--sh);font-size:20px;cursor:pointer}
.hero{text-align:center;margin:14px 0 10px}
.ringw{position:relative;width:210px;height:210px;margin:0 auto}
.ringw svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringw circle{fill:none;stroke-width:11;stroke-linecap:round}
#rg{stroke:var(--g);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .7s ease}
#rt{stroke:var(--track)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#pc{font-size:52px;font-weight:800;line-height:1}
.rc span{color:var(--mu);font-size:14px}
#msg{margin:8px 0 0;color:var(--g);font-weight:600;min-height:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.st{background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--sh)}
.st b{display:block;font-size:22px}.st span{font-size:13px;color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chip{flex:0 0 auto;border:2px solid transparent;background:var(--card);border-radius:16px;padding:8px 12px;box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px}
.chip.on{border-color:var(--c,var(--g));background:color-mix(in srgb,var(--c,var(--g)) 14%,var(--card))}
.chip i{font-style:normal;background:var(--track);border-radius:10px;padding:0 7px;font-size:12px}
.tools{display:flex;gap:8px;margin:4px 0 10px}
.tools input{flex:1;min-width:0}
input,textarea,select{width:100%;background:var(--card);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--g)}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);font-weight:600}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:var(--sh);border-right:5px solid var(--c)}
.task.done{background:var(--gl)}
.task.done .tt{text-decoration:line-through;color:var(--mu)}
.ck{flex:0 0 28px;width:28px;height:28px;border-radius:9px;border:2px solid var(--mu);background:none;cursor:pointer;color:#fff;font-size:16px;line-height:1;padding:0;margin-top:2px}
.done .ck{background:var(--g);border-color:var(--g)}
.tb{flex:1;min-width:0}.tt{font-weight:600;word-break:break-word}
.td{color:var(--mu);font-size:14px;word-break:break-word;white-space:pre-wrap}
.bd{display:inline-block;margin-top:4px;font-size:12px;padding:1px 9px;border-radius:10px;background:color-mix(in srgb,var(--c) 18%,var(--card))}
.act{display:flex;flex-direction:column;gap:2px}
.act button{border:0;background:none;font-size:18px;width:38px;height:36px;cursor:pointer;border-radius:10px}
.empty{text-align:center;color:var(--mu);padding:36px 10px}.empty b{font-size:40px;display:block}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g);color:#fff;border:0;border-radius:30px;padding:14px 28px;font-weight:700;font-size:17px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:5}
#m{display:none;position:fixed;inset:0;z-index:20}#m.on{display:block}
.bk{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sh{position:absolute;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto}
.sh h3{margin:0 0 10px}.sh label{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
.sh input,.sh textarea,.sh select{margin-bottom:4px}
.row{display:flex;gap:10px;margin-top:14px}
.b{flex:1;border:0;border-radius:14px;padding:12px;background:var(--card);box-shadow:var(--sh);font-weight:600;cursor:pointer}
.b.p{background:var(--g);color:#fff}.b.d{background:#d65b5b;color:#fff}
.er{color:#d65b5b;margin:4px 0 0;min-height:20px;font-size:14px}
.li{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.li .n{flex:1}.li .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center}
.sw,.ic{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw button.on{border-color:var(--tx)}
.ic button{width:42px;height:42px;border-radius:12px;border:2px solid var(--ln);background:var(--card);font-size:20px;cursor:pointer}
.ic button.on{border-color:var(--g);background:var(--gl)}
.note{color:var(--mu);font-size:13px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:30;display:none;font-size:14px}
textarea.mono{font-family:monospace;font-size:12px;direction:ltr;text-align:left}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div><h1>🌿 إنجاز</h1><small id="dt"></small></div>
    <button class="ib" onclick="settings()" aria-label="الإعدادات">⚙️</button>
  </div>
  <div class="hero">
    <div class="ringw">
      <svg viewBox="0 0 120 120"><circle id="rt" cx="60" cy="60" r="52"/><circle id="rg" cx="60" cy="60" r="52"/></svg>
      <div class="rc"><div id="pc">0%</div><span>نسبة إنجازك اليوم</span></div>
    </div>
    <p id="msg"></p>
  </div>
  <div class="stats">
    <div class="st"><b id="s1">0</b><span>الإجمالي</span></div>
    <div class="st"><b id="s2">0</b><span>مكتملة</span></div>
    <div class="st"><b id="s3">0</b><span>متبقية</span></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools"><input id="q" type="search" placeholder="🔍 بحث في المهام" oninput="F.q=this.value;list()"><div class="seg" id="seg"></div></div>
  <div id="list"></div>
</div>
<button class="fab" onclick="taskForm()">+ إضافة مهمة</button>
<div id="m"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='injaz-v1',COLORS=['#e57373','#4f9d69','#e0a23a','#7a9cc6','#9b7fc4','#d4829f','#3fa7a3','#8a8f98'],ICONS=['🔥','🌱','⚡','☕','📚','💼','🏠','💪','🛒','💡','❤️','✈️'];
const DEF=()=>({cats:[{id:'c1',name:'مهم وعاجل',color:COLORS[0],icon:'🔥'},{id:'c2',name:'مهم وغير عاجل',color:COLORS[1],icon:'🌱'},{id:'c3',name:'غير مهم وعاجل',color:COLORS[2],icon:'⚡'},{id:'c4',name:'غير مهم وغير عاجل',color:COLORS[3],icon:'☕'}],tasks:[],theme:''});
const valid=d=>d&&Array.isArray(d.cats)&&d.cats.length>0&&Array.isArray(d.tasks)&&d.cats.every(c=>c&&typeof c.id==='string'&&typeof c.name==='string'&&typeof c.color==='string'&&typeof c.icon==='string')&&d.tasks.every(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&typeof t.done==='boolean'&&d.cats.some(c=>c.id===t.cat));
let S;try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):null;if(!valid(S))S=DEF()}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const F={cat:'all',st:'all',q:''};
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const cat=id=>S.cats.find(c=>c.id===id)||S.cats[0];
// المعادلة الوحيدة لنسبة الإنجاز: المكتملة ÷ الإجمالي × 100 (مقرّبة)، وصفر عند عدم وجود مهام
const stats=()=>{const total=S.tasks.length,done=S.tasks.filter(t=>t.done).length;return{total,done,left:total-done,pct:total?Math.round(done/total*100):0}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',2000)}
function theme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
function head(){const s=stats();$('#pc').textContent=s.pct+'%';$('#rg').style.strokeDashoffset=326.7*(1-s.pct/100);
$('#s1').textContent=s.total;$('#s2').textContent=s.done;$('#s3').textContent=s.left;
$('#msg').textContent=!s.total?'ابدأ أول خطوة اليوم':s.pct===100?'أحسنت! أنجزت كل مهامك':'أنجزت '+s.done+' من '+s.total}
function chips(){const n=id=>S.tasks.filter(t=>id==='all'||t.cat===id).length;
$('#chips').innerHTML=[{id:'all',name:'كل المهام',icon:'📋',color:'var(--g)'}].concat(S.cats).map(c=>`<button class="chip ${F.cat===c.id?'on':''}" style="--c:${c.color}" onclick="F.cat='${c.id}';chips();list()">${c.icon} ${esc(c.name)} <i>${n(c.id)}</i></button>`).join('');
$('#seg').innerHTML=[['all','الكل'],['active','غير مكتملة'],['done','مكتملة']].map(x=>`<button class="${F.st===x[0]?'on':''}" onclick="F.st='${x[0]}';chips();list()">${x[1]}</button>`).join('')}
function list(){const q=F.q.trim().toLowerCase();
const r=S.tasks.filter(t=>(F.cat==='all'||t.cat===F.cat)&&(F.st==='all'||(F.st==='done')===t.done)&&(!q||t.title.toLowerCase().includes(q))).sort((a,b)=>a.done-b.done||b.ts-a.ts);
$('#list').innerHTML=r.length?r.map(t=>{const c=cat(t.cat);return`<div class="task ${t.done?'done':''}" style="--c:${c.color}"><button class="ck" onclick="toggle('${t.id}')" aria-label="إنجاز">${t.done?'✓':''}</button><div class="tb"><div class="tt">${esc(t.title)}</div>${t.details?`<div class="td">${esc(t.details)}</div>`:''}<span class="bd">${c.icon} ${esc(c.name)}</span></div><div class="act"><button onclick="taskForm('${t.id}')" aria-label="تعديل">✏️</button><button onclick="delTask('${t.id}')" aria-label="حذف">🗑️</button></div></div>`}).join(''):`<div class="empty"><b>🌱</b>${q?'لا توجد نتائج مطابقة':S.tasks.length?'لا توجد مهام هنا':'لا توجد مهام بعد. اضغط «إضافة مهمة» للبدء'}</div>`}
function all(){head();chips();list()}
function change(){save();all()}
function modal(h){$('#m').innerHTML='<div class="bk" onclick="closeM()"></div><div class="sh">'+h+'</div>';$('#m').className='on'}
function closeM(){$('#m').className='';$('#m').innerHTML=''}
function ask(msg,ok,fn,danger){window._fn=fn;modal(`<h3>${msg}</h3><div class="row"><button class="b ${danger?'d':'p'}" onclick="closeM();_fn()">${ok}</button><button class="b" onclick="closeM()">إلغاء</button></div>`)}
function toggle(id){const t=S.tasks.find(x=>x.id===id);t.done=!t.done;change()}
function delTask(id){ask('حذف هذه المهمة؟','حذف',()=>{S.tasks=S.tasks.filter(x=>x.id!==id);change()},1)}
function taskForm(id){const t=S.tasks.find(x=>x.id===id)||{title:'',details:'',cat:S.cats.some(c=>c.id===F.cat)?F.cat:S.cats[0].id};
modal(`<h3>${id?'تعديل المهمة':'مهمة جديدة'}</h3><input id="tt" maxlength="120" placeholder="عنوان المهمة" value="${esc(t.title)}" onkeydown="if(event.key==='Enter')saveTask('${id||''}')"><textarea id="td" rows="3" placeholder="تفاصيل (اختياري)">${esc(t.details||'')}</textarea><label>القسم</label><select id="tc">${S.cats.map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('')}</select><p class="er" id="er"></p><div class="row"><button class="b p" onclick="saveTask('${id||''}')">حفظ المهمة</button><button class="b" onclick="closeM()">إلغاء</button></div>`);
if(!id)setTimeout(()=>$('#tt').focus(),50)}
function saveTask(id){const title=$('#tt').value.trim();if(!title){$('#er').textContent='اكتب عنوان المهمة أولًا';return}
const v={title,details:$('#td').value.trim(),cat:$('#tc').value};
if(id)Object.assign(S.tasks.find(x=>x.id===id),v);else S.tasks.push({id:uid(),done:false,ts:Date.now(),...v});
closeM();change()}
function settings(){modal(`<h3>⚙️ الإعدادات</h3><div class="li"><span class="n">اسم التطبيق: إنجاز</span></div>
<div class="li"><span class="n">المظهر</span><div class="seg"><button class="${S.theme==='light'?'on':''}" onclick="setTheme('light')">فاتح</button><button class="${S.theme==='dark'?'on':''}" onclick="setTheme('dark')">داكن</button></div></div>
<div class="row"><button class="b" onclick="cats()">🗂️ إدارة الأقسام</button></div>
<div class="row"><button class="b" onclick="exp()">⬇️ تصدير نسخة احتياطية</button><button class="b" onclick="imp()">⬆️ استيراد</button></div>
<div class="row"><button class="b d" onclick="ask('إعادة ضبط التطبيق؟ سيتم حذف كل المهام والأقسام المخصصة.','إعادة ضبط',()=>{S=DEF();theme();change();toast('تمت إعادة الضبط')},1)">إعادة ضبط التطبيق</button></div>
<p class="note">بياناتك محفوظة داخل متصفح هذا الجهاز فقط. مسح بيانات المتصفح أو الموقع قد يحذفها، لذا احتفظ بنسخة احتياطية.</p>
<div class="row"><button class="b" onclick="closeM()">إغلاق</button></div>`)}
function setTheme(t){S.theme=t;save();theme();settings()}
function exp(){modal(`<h3>نسخة احتياطية</h3><p class="note">انسخ النص وخزّنه في ملاحظاتك أو أرسله لنفسك.</p><textarea id="bx" class="mono" rows="9" readonly>${esc(JSON.stringify({app:'injaz',v:1,cats:S.cats,tasks:S.tasks}))}</textarea><div class="row"><button class="b p" onclick="cp()">نسخ</button><button class="b" onclick="settings()">رجوع</button></div>`)}
function cp(){const e=$('#bx');e.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}try{navigator.clipboard.writeText(e.value);ok=true}catch(x){}toast(ok?'تم النسخ':'حدد النص وانسخه يدويًا')}
function imp(){modal(`<h3>استيراد نسخة احتياطية</h3><p class="note">الصق النص المنسوخ سابقًا. سيستبدل البيانات الحالية.</p><textarea id="bx" class="mono" rows="9"></textarea><p class="er" id="er"></p><div class="row"><button class="b p" onclick="doImp()">استيراد</button><button class="b" onclick="settings()">رجوع</button></div>`)}
function doImp(){let d;try{d=JSON.parse($('#bx').value)}catch(e){}
if(!valid(d)){$('#er').textContent='النص غير صالح. تأكد من لصق النسخة كاملة';return}
ask('استبدال البيانات الحالية بالنسخة المستوردة؟','استبدال',()=>{S={cats:d.cats,tasks:d.tasks.map(t=>({details:'',ts:0,...t})),theme:S.theme};F.cat='all';change();toast('تم الاستيراد')},1)}
function cats(){modal(`<h3>🗂️ إدارة الأقسام</h3>${S.cats.map(c=>`<div class="li"><span class="dot" style="background:${c.color}33">${c.icon}</span><span class="n">${esc(c.name)} <small class="note">(${S.tasks.filter(t=>t.cat===c.id).length})</small></span><button class="ib" style="width:38px;height:38px" onclick="catForm('${c.id}')">✏️</button><button class="ib" style="width:38px;height:38px" onclick="delCat('${c.id}')">🗑️</button></div>`).join('')}<div class="row"><button class="b p" onclick="catForm()">+ قسم جديد</button><button class="b" onclick="settings()">رجوع</button></div>`)}
let E;
function catForm(id){const c=S.cats.find(x=>x.id===id);E=c?{...c}:{id:'',name:'',color:COLORS[4],icon:ICONS[4]};cfr()}
function cfr(){modal(`<h3>${E.id?'تعديل القسم':'قسم جديد'}</h3><input id="cn" maxlength="30" placeholder="اسم القسم" value="${esc(E.name)}"><label>اللون</label><div class="sw">${COLORS.map(c=>`<button class="${c===E.color?'on':''}" style="background:${c}" onclick="pick('color','${c}')"></button>`).join('')}</div><label>الأيقونة</label><div class="ic">${ICONS.map(i=>`<button class="${i===E.icon?'on':''}" onclick="pick('icon','${i}')">${i}</button>`).join('')}</div><p class="er" id="er"></p><div class="row"><button class="b p" onclick="saveCat()">حفظ القسم</button><button class="b" onclick="cats()">إلغاء</button></div>`)}
function pick(k,v){E.name=$('#cn').value;E[k]=v;cfr()}
function saveCat(){E.name=$('#cn').value.trim();if(!E.name){$('#er').textContent='اكتب اسم القسم أولًا';return}
if(E.id)Object.assign(S.cats.find(x=>x.id===E.id),E);else S.cats.push({...E,id:uid()});change();cats()}
function delCat(id){if(S.cats.length<2){toast('يجب أن يبقى قسم واحد على الأقل');return}
const n=S.tasks.filter(t=>t.cat===id).length,o=S.cats.filter(c=>c.id!==id);
if(!n){ask('حذف هذا القسم؟','حذف',()=>rmCat(id),1);return}
modal(`<h3>يحتوي هذا القسم على ${n} مهمة</h3><label>نقل المهام إلى</label><select id="mv">${o.map(c=>`<option value="${c.id}">${c.icon} ${esc(c.name)}</option>`).join('')}</select><div class="row"><button class="b p" onclick="rmCat('${id}',$('#mv').value)">نقل المهام وحذف القسم</button></div><div class="row"><button class="b d" onclick="rmCat('${id}')">حذف القسم مع مهامه</button></div><div class="row"><button class="b" onclick="cats()">إلغاء</button></div>`)}
function rmCat(id,to){S.tasks=to?S.tasks.map(t=>t.cat===id?{...t,cat:to}:t):S.tasks.filter(t=>t.cat!==id);S.cats=S.cats.filter(c=>c.id!==id);if(F.cat===id)F.cat='all';change();cats()}
$('#dt').textContent=new Date().toLocaleDateString('ar',{weekday:'long',day:'numeric',month:'long'});
theme();all();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
